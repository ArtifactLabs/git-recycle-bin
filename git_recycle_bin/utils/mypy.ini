[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_calls = False
disallow_incomplete_defs = False
namespace_packages = True
explicit_package_bases = True

# Ignore some errors in git_recycle_bin.py
[[mypy.per-file-options]]
files = src/git_recycle_bin.py
disallow_assignment_from_optional = False

# Ignore import errors for maya module
[mypy-maya]
ignore_missing_imports = True
follow_imports = skip

[mypy-maya.*]
ignore_missing_imports = True
follow_imports = skip 